[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pw-bot-runtime"
version = "0.1.0"
description = "Drives a real Luanti client from pw_player_bot intents for PerfectWorld"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# No required Python dependencies on purpose.
#
# tomllib is standard library from 3.11, and the input layer works through
# xdotool (a binary, not a package) when python-xlib is absent. A runtime that
# needs a virtualenv before it can be checked is a runtime nobody checks, and
# `doctor` has to be runnable on a bare server.
dependencies = []

[project.optional-dependencies]
# Preferred input backend: one X connection for the whole run instead of a
# subprocess per key. On Debian this is packaged as python3-xlib.
xtest = ["python-xlib>=0.33"]
dev = ["pytest>=7"]

[project.scripts]
pw-bot-runtime = "pw_bot_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
