# Controlled client configuration for PW Bot.
#
# The runtime launches the client with `--config` pointing here, so the bot's
# key bindings are known rather than inherited from whatever the operator last
# set in their own Luanti. Two things here are load-bearing.
#
# **Place and dig are bound to keyboard keys.** By default they are mouse
# buttons, and a mouse button is delivered to whatever sits under the X pointer.
# The bot turns its head with *relative* pointer motion, so after a few
# corrections the X pointer is nowhere near the window and the clicks land on
# the root window — silently, with no error and no effect. Under a normal
# desktop the client's pointer grab hides this; on a bare Xvfb there is nothing
# to hide it. Binding both to keys removes the whole class of problem, and a
# human player can rebind them the same way.
#
# **Nothing here gives the bot an advantage.** No noclip, no fly, no fast, no
# increased reach. The bot is meant to meet the world the way a player does.

# --- what the runtime presses ---
#
# Bindings are SDL scancodes, not the legacy KEY_KEY_* names. Luanti 5.13 writes
# `keymap_forward = SYSTEM_SCANCODE_26`, and a legacy name in this file parses to
# nothing: the action ends up unbound and the key silently does nothing. That is
# a long afternoon if you assume it worked.
#
#   4=A  9=F  21=R  22=S  23=T  26=W  7=D  44=space  225=left shift
keymap_place = SYSTEM_SCANCODE_21
keymap_dig = SYSTEM_SCANCODE_9
keymap_forward = SYSTEM_SCANCODE_26
keymap_backward = SYSTEM_SCANCODE_22
keymap_left = SYSTEM_SCANCODE_4
keymap_right = SYSTEM_SCANCODE_7
keymap_jump = SYSTEM_SCANCODE_44
keymap_sneak = SYSTEM_SCANCODE_225
keymap_chat = SYSTEM_SCANCODE_23

# --- one press means one action ---
#
# The client samples "place" once per rendered frame, and this one draws through
# software GL on an Xvfb display, where a frame can take a good fraction of a
# second. A press has to be held across a frame boundary to be seen at all: a
# 0.18 s tap on the place key did nothing at the course door, while a 0.5 s tap
# on the dig key destroyed a node, which is what pointed at duration rather than
# at the binding.
#
# Holding that long would normally repeat the action — and on a door, two
# activations means opened and closed again, which is indistinguishable from
# nothing happening. Pinning the repeat interval to its maximum makes a single
# long hold fire exactly once, so the runtime can hold as long as a slow frame
# needs without a hold ever meaning two clicks.
repeat_place_time = 2.0

# --- no cheats ---
noclip = false
free_move = false
fast_move = false
pitch_move = false

# --- a quiet, predictable client ---
enable_sound = false
mute_sound = true
show_debug = false
enable_particles = false
enable_clouds = false
enable_fog = false
enable_shaders = false
menu_clouds = false
enable_minimap = false
autojump = false

# Keep the view stable: the runtime measures yaw against the bridge and a
# changing field of view would make a measured calibration wrong.
fov = 72
mouse_sensitivity = 0.2
zoom_fov = 15

# Modest view range. The bot's perception comes from the bridge, not from what
# the client draws, so a long draw distance costs frames and buys nothing.
viewing_range = 240
max_block_send_distance = 6

# The runtime supervises the process; the client should not wait for a human.
keymap_toggle_chat = KEY_F2
name = pwbot
