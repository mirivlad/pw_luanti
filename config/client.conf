# Client configuration for the headless pwbot test/screenshot client.
#
# Defaults produce heavy fog at ~100 nodes and a cloud layer that whites out
# any camera placed above it, which makes village screenshots unusable.

viewing_range = 400
enable_fog = false
enable_clouds = false
enable_particles = false

# Fill the Xvfb screen; `import` grabs this window.
screen_w = 1280
screen_h = 1000
fullscreen = false

# Keep the frame clear of interface for screenshots.
enable_minimap = false
show_debug = false
enable_damage = false

# Deterministic look: no view bobbing or camera smoothing between shots.
view_bobbing_amount = 0
camera_smoothing = 0
enable_view_bobbing = false

# Headless: no sound device in the container/Xvfb session.
enable_sound = false
mute_sound = true
