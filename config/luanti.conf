server_name = PerfectWorld Dev
server_description = PerfectWorld on Luanti/Mineclonia.
motd = Welcome to PerfectWorld dev server.
enable_server = true
creative_mode = true
enable_damage = false
default_privs = interact, shout, fly, fast, noclip, server

# The server administrator. Luanti grants this account every registered
# privilege at runtime, by name, so it survives regenerating the world — which
# the measurement scripts do. Granting through chat does not work here: the test
# overlay runs the server without `--terminal`, so there is no console to write
# `/grant` into, which is why `run-testkit.sh` has been "granting privileges" to
# pwbot for a while without granting anything.
name = mirivlad
max_users = 10
strict_protocol_version_checking = false

# Emerge queue: village materialization asks for a whole site at once.
emergequeue_limit_total = 4096
emergequeue_limit_diskonly = 1024
emergequeue_limit_generate = 1024
num_emerge_threads = 2

# --- PW Bot -------------------------------------------------------------
# Perception, decisions and the spools tools/pw_bot_runtime reads. All of it is
# off by default in the mods; this dev server opts in so a real client can be
# driven here.
#
# On a public server leave the transports off unless you intend to run a bot:
# a spool is a channel to a cooperating local process, not a privilege boundary.
pw_bot_bridge.autoregister = pwbot:player
pw_bot_bridge.external_transport = true
pw_player_bot.autostart = pwbot
pw_player_bot.intent_transport = true
